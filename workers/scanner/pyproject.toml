[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openhuntx-webguard-scanner"
version = "0.1.0"
description = "Isolated scanning components for OpenHuntX WebGuard"
requires-python = ">=3.11,<3.15"
dependencies = [
    "openhuntx-webguard-contracts==0.1.0",
]

[project.scripts]
webguard = "webguard_scanner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
