name: openhuntx-webguard-lab

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.1.1
    hostname: juice-shop
    restart: "no"

    ports:
      # Localhost binding prevents other devices from reaching the
      # deliberately vulnerable application.
      - "127.0.0.1:3000:3000"

    networks:
      - webguard-lab

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  webguard-lab:
    name: openhuntx-webguard-lab
    driver: bridge
