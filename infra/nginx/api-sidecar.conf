# Host-local TLS-terminating reverse-proxy sidecar for the WebGuard
# API process (docs/production/PUBLIC_EDGE_SECURITY.md section 2's
# "bracketed hop", previously named but never configured: "the
# sidecar's actual configuration is deployment-specific and out of
# this document's scope"). This file is that configuration for nginx.
#
# Topology this fills in (PUBLIC_EDGE_SECURITY.md section 2):
#   Internet -> Cloudflare (TLS, WAF, rate limiting) -> Load balancer
#     -> [this sidecar] -> WebGuard API process (127.0.0.1:8765)
#
# Runs on the SAME host as `webguard-api serve`, in front of its
# loopback-only bind (production_config.py's non-loopback-binding
# rejection is enforced independently of this file and is not relaxed
# by adding it: the API process still refuses to bind anywhere but
# 127.0.0.1/::1 regardless of what fronts it).
#
# Not syntax-validated against a real nginx binary (none was available
# in the environment this was written in). Review with `nginx -t`
# before use.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.openhuntx.com;

    # Confirmed by local container validation: without this, nginx's
    # own version string leaks on every response (Server header) and
    # on its own error pages (502/413/etc), for no operational benefit.
    server_tokens off;

    # Cloudflare re-encrypts to the load balancer, the load balancer to
    # this sidecar (PUBLIC_EDGE_SECURITY.md section 4's "origin is
    # never directly reachable"): this certificate is the origin cert
    # for that hop, not a publicly-trusted one Cloudflare's own edge
    # certificate already covers.
    ssl_certificate     /etc/ssl/origin/api.openhuntx.com.pem;
    ssl_certificate_key /etc/ssl/origin/api.openhuntx.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Matches DEFAULT_API_MAXIMUM_REQUEST_BYTES (cli.py/config.py,
    # 65536) and the edge's own 131072-byte block (cloudflare.tf) --
    # 128k is the outer ceiling either layer could ever pass through;
    # sized to the edge rule, not the smaller in-process default, so
    # this sidecar never rejects something the API itself would still
    # accept.
    client_max_body_size 128k;

    # WEBGUARD_TRUSTED_PROXY_CIDRS must include 127.0.0.1/32 (and
    # ::1/128 if this sidecar and the API both listen on the loopback
    # dual-stack) for the API's own CF-Connecting-IP/X-Forwarded-For
    # trust logic (http_api.py's _resolve_client_ip) to ever read
    # either header: the API's only possible direct TCP peer is this
    # same-host process, never Cloudflare's own edge IP ranges, which
    # belong at the load-balancer/security-group layer instead, not in
    # this variable.
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Cloudflare already set this upstream; pass it through
        # unmodified rather than overwriting it with $remote_addr
        # (which, at this hop, is the load balancer's own address, not
        # the real client's).
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # No request buffering delay for the API's own streaming
        # report-download response (GET /v1/reports/{id}/download);
        # nginx's default buffering is fine for every other JSON route
        # but would otherwise hold the full body in memory before
        # forwarding it to the client.
        proxy_buffering off;
    }

    # Health/readiness are served on the same port as the API itself
    # (http_api.py's do_GET, before authentication): no separate
    # health port, no auth header needed, matching
    # PUBLIC_EDGE_SECURITY.md section 2's own note that the API never
    # opens a second listener for this. access_log off keeps routine
    # LB/monitoring polls out of the request log.
    location = /healthz {
        proxy_pass http://127.0.0.1:8765/healthz;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8765/ready;
        access_log off;
    }
}

# Plain HTTP on 80 exists only to redirect to HTTPS. WEBGUARD_SECURE_COOKIES=true
# and WEBGUARD_HSTS_ENABLED=true (below) both assume every request
# this sidecar forwards arrived over TLS; a client that never upgrades
# would otherwise silently receive a Secure cookie it can never send
# back.
server {
    listen 80;
    listen [::]:80;
    server_name api.openhuntx.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}
