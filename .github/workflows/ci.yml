name: WebGuard CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11.15"
          - "3.12.13"
          - "3.13.14"
          - "3.14.6"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          pip-version: "26.2.1"
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.lock
            requirements-ci.lock
            requirements-dev.txt
            packages/contracts/python/pyproject.toml
            workers/scanner/pyproject.toml
            apps/api/pyproject.toml

      - name: Install hash-locked dependencies and project packages
        run: ./scripts/install-locked-dependencies.sh

      - name: Run local verification gate
        run: ./scripts/verify.sh

  authorised-lab-integration:
    name: Authorised Juice Shop integration
    needs:
      - unit-tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          pip-version: "26.2.1"
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.lock
            requirements-ci.lock
            requirements-dev.txt
            packages/contracts/python/pyproject.toml
            workers/scanner/pyproject.toml
            apps/api/pyproject.toml

      - name: Install hash-locked dependencies and project packages
        run: ./scripts/install-locked-dependencies.sh

      - name: Start isolated Juice Shop
        run: |
          docker compose \
            -f infra/compose/compose.lab.yml \
            up -d

      - name: Wait for Juice Shop health
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(
            docker compose \
              -f infra/compose/compose.lab.yml \
              ps -q juice-shop
          )"

          if [[ -z "$container_id" ]]; then
            echo "Juice Shop container was not created."
            exit 1
          fi

          for attempt in $(seq 1 60); do
            status="$(
              docker inspect \
                --format '{{.State.Health.Status}}' \
                "$container_id" \
                2>/dev/null \
                || true
            )"

            echo "Health attempt ${attempt}: ${status:-unknown}"

            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi

            if [[ "$status" == "unhealthy" ]]; then
              docker compose \
                -f infra/compose/compose.lab.yml \
                logs --tail=100 juice-shop
              exit 1
            fi

            sleep 2
          done

          docker compose \
            -f infra/compose/compose.lab.yml \
            logs --tail=100 juice-shop

          echo "Juice Shop did not become healthy in time."
          exit 1

      - name: Run authorised integration tests
        env:
          WEBGUARD_RUN_INTEGRATION: "1"
          WEBGUARD_LAB_TARGET: "http://127.0.0.1:3000/"
        run: |
          python -m unittest discover \
            -s tests/integration \
            -p 'test_*.py' \
            -v

      - name: Stop isolated Juice Shop
        if: always()
        run: |
          docker compose \
            -f infra/compose/compose.lab.yml \
            down --volumes --remove-orphans
