name: Publish to PyPI

# Manual dispatch only: no push, pull_request, or release event starts this.
# No PyPI credential is stored anywhere. PyPI authenticates the publish job
# with a short-lived OIDC identity token, so it cannot succeed until both
# PyPI projects have a trusted publisher pointing at this repository, this
# workflow file, and the pypi-publish environment. docs/RELEASING.md has the
# exact fields, the release sequence, and the partial-upload recovery.
#
# The default mode is dry-run: it builds, validates, hands the artifacts to
# the publish job, re-verifies them there, and stops before any upload.
# Run it first to rehearse everything except the upload itself.
#
# What actually restricts publishing:
#   - The pypi-publish environment's deployment-branch policy (repository
#     Settings, Environments), which allows only main. GitHub enforces it on
#     the server, so it still holds if someone edits this file on another
#     branch. This is the independent control.
#   - id-token: write exists only on the publish job, and that job only
#     receives artifacts the build job already validated.
# The typed confirmation and the github.ref condition on the build job stop
# a mistaken dispatch early, but anyone able to edit this file on a branch
# can delete them. Do not count them as protection.
#
# Published files cannot be overwritten on PyPI, and a deleted filename can
# never be reused. Nothing here assumes otherwise: the publish job refuses
# to upload a version that already exists, uploads the dependency
# (openhuntx-webguard-contracts) before the package that needs it, and has
# a webguard-only mode for finishing a release where only the first upload
# succeeded.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          dry-run rehearses everything except the upload. publish uploads
          both distributions. publish-webguard-only uploads only
          openhuntx-webguard, for finishing a release after the contracts
          upload succeeded and the webguard upload failed.
        type: choice
        options:
          - dry-run
          - publish
          - publish-webguard-only
        default: dry-run
      confirm:
        description: 'Required for publish modes: type "publish". Ignored by dry-run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    name: Build and verify the release artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      contracts_sha256: ${{ steps.verify.outputs.contracts_sha256 }}
      scanner_sha256: ${{ steps.verify.outputs.scanner_sha256 }}

    steps:
      - name: Require the typed confirmation for publish modes
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$MODE" != "dry-run" ] && [ "$CONFIRM" != "publish" ]; then
            echo "Mode $MODE needs the confirmation input to be exactly: publish" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          pip-version: "26.2.1"

      - name: Build the two wheels
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p release/dist
          python -m pip wheel packages/contracts/python -w release/dist --no-deps
          python -m pip wheel workers/scanner -w release/dist --no-deps

      - name: Validate, install, and smoke-test exactly those files
        id: verify
        run: |
          python scripts/verify-release-artifacts.py \
            --dist release/dist \
            --checksums-out release/SHA256SUMS \
            --github-output "$GITHUB_OUTPUT"

      - name: Record what would be uploaded
        run: |
          {
            echo "### Release artifacts"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the verified files to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the verified artifacts
    needs: build-and-verify
    runs-on: ubuntu-24.04
    environment: pypi-publish
    permissions:
      id-token: write

    steps:
      - name: Download the artifacts the build job verified
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release
          digest-mismatch: error

      - name: Re-verify the downloaded files and stage one directory per project
        env:
          VERSION: ${{ needs.build-and-verify.outputs.version }}
          CONTRACTS_SHA256: ${{ needs.build-and-verify.outputs.contracts_sha256 }}
          SCANNER_SHA256: ${{ needs.build-and-verify.outputs.scanner_sha256 }}
        run: |
          set -euo pipefail
          contracts="openhuntx_webguard_contracts-${VERSION}-py3-none-any.whl"
          scanner="openhuntx_webguard-${VERSION}-py3-none-any.whl"

          expected="$(printf '%s\n' release/SHA256SUMS release/dist "release/dist/${contracts}" "release/dist/${scanner}" | sort)"
          actual="$(find release -mindepth 1 | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "Unexpected contents in the downloaded artifact:" >&2
            echo "$actual" >&2
            exit 1
          fi

          (cd release/dist && sha256sum -c ../SHA256SUMS)
          test "$(sha256sum "release/dist/${contracts}" | cut -d' ' -f1)" = "$CONTRACTS_SHA256"
          test "$(sha256sum "release/dist/${scanner}" | cut -d' ' -f1)" = "$SCANNER_SHA256"

          mkdir -p stage/contracts stage/webguard
          cp "release/dist/${contracts}" stage/contracts/
          cp "release/dist/${scanner}" stage/webguard/
          test "$(find stage/contracts -type f | wc -l)" -eq 1
          test "$(find stage/webguard -type f | wc -l)" -eq 1
          test "$(sha256sum "stage/contracts/${contracts}" | cut -d' ' -f1)" = "$CONTRACTS_SHA256"
          test "$(sha256sum "stage/webguard/${scanner}" | cut -d' ' -f1)" = "$SCANNER_SHA256"

      - name: Check what PyPI already has
        env:
          MODE: ${{ github.event.inputs.mode }}
          VERSION: ${{ needs.build-and-verify.outputs.version }}
        run: |
          set -euo pipefail
          status() {
            curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$1/${VERSION}/json"
          }
          contracts="$(status openhuntx-webguard-contracts)"
          webguard="$(status openhuntx-webguard)"
          echo "PyPI status for ${VERSION}: openhuntx-webguard-contracts=${contracts} openhuntx-webguard=${webguard} (200 exists, 404 absent)"

          for code in "$contracts" "$webguard"; do
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "PyPI answered ${code}; refusing to guess whether the version exists." >&2
              exit 1
            fi
          done

          case "$MODE" in
            dry-run)
              echo "Dry run: not uploading anything."
              ;;
            publish)
              if [ "$contracts" != "404" ] || [ "$webguard" != "404" ]; then
                echo "A version ${VERSION} already exists on PyPI, and files cannot be overwritten. Bump the version instead." >&2
                exit 1
              fi
              ;;
            publish-webguard-only)
              if [ "$contracts" != "200" ] || [ "$webguard" != "404" ]; then
                echo "publish-webguard-only needs contracts ${VERSION} already on PyPI and webguard ${VERSION} absent." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown mode: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Publish openhuntx-webguard-contracts
        if: github.event.inputs.mode == 'publish'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, v1.14.2
        with:
          packages-dir: stage/contracts/
          skip-existing: false
          attestations: true
          print-hash: true

      - name: Publish openhuntx-webguard
        if: github.event.inputs.mode == 'publish' || github.event.inputs.mode == 'publish-webguard-only'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, v1.14.2
        with:
          packages-dir: stage/webguard/
          skip-existing: false
          attestations: true
          print-hash: true
