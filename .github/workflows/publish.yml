name: Publish to PyPI

# Manual-only. This does not run on push, pull_request, or release events,
# so creating a release or pushing a tag cannot trigger a publish by
# accident; a human has to open the Actions tab and click "Run workflow."
# It also cannot succeed yet: PyPI trusted publishing (OIDC) must be
# configured on the PyPI project side first, pointing at this repository,
# workflow file, and environment name. Until that's done, the "Publish"
# step below fails at the identity-token exchange with no stored secret
# ever involved. See docs/CLI_RELEASE_CHECKLIST.md for what's still open.
#
# Manual dispatch and the typed confirmation below are supplementary
# controls, not the thing that actually restricts what gets published.
# Two controls do that instead:
#   - the `github.ref` check below, so this only runs from main even if
#     workflow_dispatch is invoked from a branch carrying a modified copy
#     of this file;
#   - the pypi-publish environment's own branch-policy restriction
#     (configured server-side in this repository's Settings ->
#     Environments, not by anything in this file), which GitHub enforces
#     regardless of what the dispatched ref's copy of this workflow says.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. Anything else aborts.'
        required: true

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.event.inputs.confirm == 'publish' && github.ref == 'refs/heads/main'
    name: Build and publish openhuntx-webguard-contracts and openhuntx-webguard
    runs-on: ubuntu-24.04
    environment: pypi-publish

    permissions:
      contents: read
      id-token: write  # required for PyPI trusted publishing (OIDC); no API token is stored in this repo

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          pip-version: "26.2.1"

      - name: Build the contracts and scanner wheels
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m pip wheel packages/contracts/python -w dist --no-deps
          python -m pip wheel workers/scanner -w dist --no-deps

      - name: Verify built wheels before publishing
        run: |
          set -euo pipefail
          ls -la dist/
          sha256sum dist/*.whl
          count="$(find dist -maxdepth 1 -name '*.whl' | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "Expected exactly 2 wheels in dist/, found $count" >&2
            exit 1
          fi
          for expected in 'openhuntx_webguard-*-py3-none-any.whl' 'openhuntx_webguard_contracts-*-py3-none-any.whl'; do
            if ! compgen -G "dist/$expected" > /dev/null; then
              echo "Expected wheel matching dist/$expected was not built" >&2
              exit 1
            fi
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, v1.14.2
        with:
          packages-dir: dist/
          attestations: true
