[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openhuntx-webguard-contracts"
version = "0.1.0"
description = "Shared data contracts for OpenHuntX WebGuard"
requires-python = ">=3.11,<3.15"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
