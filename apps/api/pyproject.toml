[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhuntx-webguard-api"
version = "0.3.0"
description = "Lease-aware local control-plane API and scanner job queue for OpenHuntX WebGuard"
requires-python = ">=3.11"
dependencies = [
    "openhuntx-webguard-contracts==0.1.0",
    "openhuntx-webguard-scanner==0.1.0",
]

[project.scripts]
webguard-api = "webguard_api.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
